name: Publish to npm

# Auto-publish a new version whenever a branch named `version_x.y.z` is MERGED into main.
# The branch name carries the version: version_1.4.0 -> publishes 1.4.0.
# Also runnable manually (workflow_dispatch) with an explicit version.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (x.y.z)"
        required: true

jobs:
  publish:
    # PR path: only when a version_* branch was actually MERGED (closing without merge is ignored).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'version_'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version-bump commit + tag back to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.pull_request.head.ref }}"
            VERSION="${VERSION#version_}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a valid x.y.z version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Abort if this version is already on npm
        run: |
          V="${{ steps.ver.outputs.version }}"
          if npm view "@neurealistic/browser-inspector@$V" version >/dev/null 2>&1; then
            echo "::error::@neurealistic/browser-inspector@$V already published"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Align package.json to the release version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit bump + tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$V [skip ci]" || echo "nothing to commit"
          git tag "v$V"
          git push origin main --tags
          gh release create "v$V" --title "v$V" \
            --notes "Automated release of \`@neurealistic/browser-inspector@$V\`." \
            || echo "release create skipped"
